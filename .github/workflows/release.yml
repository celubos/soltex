name: release

# Adds the Windows installer to a published release. The installer wraps exactly the app folder from the release's
# verified zip, so both downloads contain the same files. Only a zip whose BUILD.json says it was built from the
# tagged commit, from a clean tree, with every test run and passed, is accepted.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the installer to (for example v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # The token is given only to the two steps that call gh.
      - name: Download and check the release zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "The tag must look like v1.2.3; got '$env:TAG'." }
          $tagVersion = $Matches[1]
          $tagCommit = git rev-parse --verify --quiet "refs/tags/$env:TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw "Cannot find the commit of tag $env:TAG." }
          $tagCommit = $tagCommit.Trim()
          if ((git rev-parse HEAD).Trim() -ne $tagCommit) { throw "The checkout is not the commit tagged $env:TAG." }

          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern 'Soltex-*-win-x64.zip' --pattern 'SHA256SUMS.txt' --dir dist
          if ($LASTEXITCODE) { throw 'Downloading the release files failed.' }
          $zipName = "Soltex-$tagVersion-win-x64.zip"
          $zip = Get-Item -LiteralPath (Join-Path dist $zipName) -ErrorAction SilentlyContinue
          if (-not $zip) { throw "The release has no $zipName." }
          $line = @(Get-Content dist\SHA256SUMS.txt | Where-Object { $_ -match ('^[0-9a-fA-F]{64}\s+\*?' + [regex]::Escape($zipName) + '$') })
          if ($line.Count -ne 1) { throw "SHA256SUMS.txt must list $zipName exactly once." }
          $expected = ($line[0] -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 of $zipName does not match SHA256SUMS.txt." }

          tar -xf $zip.FullName -C dist
          if ($LASTEXITCODE) { throw 'Unpacking the zip failed.' }
          $folder = Join-Path $PWD "dist\Soltex-$tagVersion-win-x64"
          if (-not (Test-Path -LiteralPath (Join-Path $folder 'Soltex.exe') -PathType Leaf)) { throw "The zip has no Soltex-$tagVersion-win-x64\Soltex.exe." }

          # The zip must be the release build of exactly this tag (see eng/build-audio.ps1 and eng/make-release.ps1).
          $build = Get-Content -Raw -LiteralPath (Join-Path $folder 'BUILD.json') | ConvertFrom-Json
          $problems = @()
          if ($build.SourceCommit -ne $tagCommit) { $problems += "SourceCommit is '$($build.SourceCommit)'; $env:TAG is $tagCommit" }
          if ($build.Version -ne $tagVersion) { $problems += "Version is '$($build.Version)'; expected '$tagVersion'" }
          if ($build.SourceDirty -ne $false) { $problems += "SourceDirty is '$($build.SourceDirty)'; expected False (built with uncommitted changes)" }
          if ($build.TestsSkipped -ne $false) { $problems += "TestsSkipped is '$($build.TestsSkipped)'; expected False" }
          if ($build.Verification.Status -ne 'Passed') { $problems += "Verification.Status is '$($build.Verification.Status)'; expected 'Passed'" }
          $exeVersion = ([Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $folder 'Soltex.exe')).ProductVersion -split '\+')[0].Trim()
          if ($exeVersion -ne $tagVersion) { $problems += "Soltex.exe reports version '$exeVersion'; expected '$tagVersion'" }
          if ($problems.Count -gt 0) { throw "$zipName is not the release build of ${env:TAG}:`n - $($problems -join "`n - ")" }
          Write-Host "$zipName was built from $tagCommit with every test passed."

          "APP_DIR=$folder" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV
          "APP_VERSION=$tagVersion" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV

      # The pinned version from the script; Chocolatey checks the download against that package's SHA-256.
      - name: Get Inno Setup
        shell: pwsh
        run: .\eng\installer\get-inno-setup.ps1 -GitHubEnv

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $numeric = ($env:APP_VERSION -split '-')[0]
          & $env:ISCC /Qp "/DPublishDir=$env:APP_DIR" "/DAppVersion=$env:APP_VERSION" "/DNumericVersion=$numeric" "/DOutputDir=$PWD\dist\out" eng\soltex.iss
          if ($LASTEXITCODE) { throw "ISCC failed: $LASTEXITCODE" }

      # Also upgrades and uninstalls while Soltex is running, as users do.
      - name: Install, upgrade and uninstall
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item -LiteralPath "dist\out\Soltex-$env:APP_VERSION-win-x64-setup.exe"
          .\eng\installer\test-installer.ps1 -Setup $setup.FullName -Version $env:APP_VERSION

      - name: Add the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item -LiteralPath "dist\out\Soltex-$env:APP_VERSION-win-x64-setup.exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = @(Get-Content dist\SHA256SUMS.txt | Where-Object { $_ -and $_ -notmatch ('\s\*?' + [regex]::Escape($setup.Name) + '$') })
          $sums += "$hash  $($setup.Name)"
          # LF line endings and no byte order mark, as eng/make-release.ps1 writes it, so `sha256sum -c` works.
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS.txt'), ($sums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          gh release upload $env:TAG $setup.FullName dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { throw 'Uploading to the release failed.' }
