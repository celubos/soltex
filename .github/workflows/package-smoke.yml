name: package-smoke

on:
  push:
    paths:
      - '.github/workflows/package-smoke.yml'
      - 'Directory.Build.props'
      - 'global.json'
      - 'eng/make-icon.ps1'
      - 'eng/publish-release.ps1'
      - 'eng/record-package-identity.ps1'
      - 'eng/package/**'
      - 'native/Soltex.TaskbarStyle/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/package-smoke.yml'
      - 'Directory.Build.props'
      - 'global.json'
      - 'eng/make-icon.ps1'
      - 'eng/publish-release.ps1'
      - 'eng/record-package-identity.ps1'
      - 'eng/package/**'
      - 'native/Soltex.TaskbarStyle/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  publish-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # Same feature band as global.json.
          dotnet-version: 10.0.3xx

      - name: Prepare validation directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\artifacts\validation | Out-Null

      # -Acquire downloads the pinned LLVM-MinGW release and checks its size and SHA-256 before use;
      # later steps and scripts find that toolchain through SOLTEX_LLVM_MINGW.
      - name: Build native taskbar helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'toolchains'
          .\native\Soltex.TaskbarStyle\build.ps1 -Acquire -CacheRoot $cacheRoot 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\native-taskbar.log
          $lock = Get-Content -Raw .\native\Soltex.TaskbarStyle\toolchain.lock.json | ConvertFrom-Json
          "SOLTEX_LLVM_MINGW=$(Join-Path $cacheRoot $lock.packages[0].folder)" |
            Add-Content -Encoding utf8 -Path $env:GITHUB_ENV

      # Publishes the same folder layout the installer and the release zip ship: the app with its
      # runtime, TaskbarHelper\ and Soltex.Audio.Host\.
      - name: Publish self-contained desktop package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\eng\publish-release.ps1 -Version '0.0.0-ci' -Runtime 'win-x64' -SkipInstaller 2>&1 |
            Tee-Object -FilePath .\artifacts\validation\package-publish.log

      - name: Launch published package render smoke
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path .\artifacts\publish\win-x64\Soltex.exe
          $output = [System.IO.Path]::GetFullPath('.\artifacts\validation\package-my-pc.png')
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @('--render-smoke', $output, '--panel', 'my-pc') `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          "exit_code=$($process.ExitCode)" | Set-Content -Encoding UTF8 .\artifacts\validation\package-launch.log
          if ($process.ExitCode -ne 0) {
            throw "Published package render failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath .\artifacts\validation\package-my-pc.png -PathType Leaf)) {
            throw 'The published package did not create its My PC render.'
          }
          if (Test-Path -LiteralPath .\artifacts\validation\package-my-pc.png.error.txt -PathType Leaf) {
            Get-Content -LiteralPath .\artifacts\validation\package-my-pc.png.error.txt
            throw 'The published package produced a render-smoke error file.'
          }

      - name: Record package identity
        shell: pwsh
        env:
          SOLTEX_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\eng\record-package-identity.ps1 `
            -ExecutablePath .\artifacts\publish\win-x64\Soltex.exe `
            -RenderPath .\artifacts\validation\package-my-pc.png `
            -Panel my-pc `
            -OutputPath .\artifacts\validation\package-smoke.json `
            -Runtime win-x64 `
            -SourceHeadSha $env:SOLTEX_SOURCE_HEAD_SHA `
            -TestedCommitSha $env:GITHUB_SHA `
            -EventName $env:GITHUB_EVENT_NAME `
            -HeadRef $env:GITHUB_HEAD_REF

      - name: Upload package smoke results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: soltex-package-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/publish/win-x64/Soltex.exe
            artifacts/publish/win-x64/Soltex.dll
            artifacts/validation/package-publish.log
            artifacts/validation/package-launch.log
            artifacts/validation/package-my-pc.png
            artifacts/validation/package-my-pc.png.error.txt
            artifacts/validation/package-smoke.json
          if-no-files-found: warn
          retention-days: 30
