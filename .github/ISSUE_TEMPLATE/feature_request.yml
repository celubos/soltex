name: Feature request
description: Suggest something Soltex could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Soltex to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help?
      description: The problem it solves, or how you do it today.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched existing issues for the same idea.
          required: true
